name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y librdkafka-dev libpq-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
          dune-cache: true

      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune test

      - run: docker compose up -d --wait
      - run: ./scripts/init.sh
      - run: opam exec -- dune exec bin/check_services.exe
      - run: opam exec -- dune build @integration
      - run: opam exec -- dune exec bin/generate.exe -- -output synthetic.events -events 100000
      - run: opam exec -- dune exec bin/replay.exe -- -input synthetic.events -topic etf.events.test
