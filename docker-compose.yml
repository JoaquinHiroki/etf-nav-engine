services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: nav
      POSTGRES_PASSWORD: nav
      POSTGRES_DB: nav
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nav -d nav"]
      interval: 5s
      timeout: 5s
      retries: 30
